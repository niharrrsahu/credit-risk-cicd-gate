name: "Credit Risk CI/CD Quality Gate"

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality-gate:
    name: "Automated Tests, Training & Quality Gate"
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Step 1: Execute Automated Unit Tests"
        shell: bash
        run: |
          echo "=== Python Environment Check ==="
          python -c "import sys, os; print('CWD:', os.getcwd()); print('sys.path:', sys.path); import src.config_schema; print('src imported successfully')"
          echo "=== Executing Pytest Suite ==="
          python -m pytest -v --tb=long tests/ 2>&1 | tee pytest_output.log
          PYTEST_CODE=${PIPESTATUS[0]}
          echo "Pytest exit code: $PYTEST_CODE"
          echo "### Unit Test Execution Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $PYTEST_CODE -ne 0 ]; then
            exit $PYTEST_CODE
          fi

      - name: "Step 2: Train Candidate Model (CI Configuration)"
        run: |
          echo "Training candidate model with config/ci.yaml..."
          python scripts/ci_train.py

      - name: "Step 3: Evaluate CI/CD Quality Gate"
        run: |
          echo "Comparing candidate metrics against baseline_metrics.json..."
          python -m src.gate candidate_metrics.json config/ci.yaml pr_summary.md

      - name: "Step 4: Publish Job Summary"
        if: always()
        run: |
          if [ -f pr_summary.md ]; then
            cat pr_summary.md >> $GITHUB_STEP_SUMMARY
          fi
