name: "Credit Risk CI/CD Quality Gate"

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  quality-gate:
    name: "Automated Tests, Training & Quality Gate"
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: "Step 1: Execute Automated Unit Tests"
        shell: bash
        run: |
          python -m pytest -v --tb=short tests/ > pytest_output.log 2>&1 || true
          cat pytest_output.log
          echo "### Unit Test Execution Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "Push Test Logs"
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          cp pytest_output.log test_failure_log.txt
          git add test_failure_log.txt
          git commit -m "ci: save test failure log"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/niharrrsahu/credit-risk-cicd-gate.git ci-logs

      - name: "Enforce Unit Test Success"
        shell: bash
        run: |
          if grep -E -q "FAILED|ERROR" pytest_output.log; then
            echo "Unit test suite detected failures or errors!"
            exit 1
          fi

      - name: "Step 2: Train Candidate Model (CI Configuration)"
        run: |
          echo "Training candidate model with config/ci.yaml..."
          python scripts/ci_train.py

      - name: "Step 3: Evaluate CI/CD Quality Gate"
        run: |
          echo "Comparing candidate metrics against baseline_metrics.json..."
          python -m src.gate candidate_metrics.json config/ci.yaml pr_summary.md

      - name: "Step 4: Publish Job Summary"
        if: always()
        run: |
          if [ -f pr_summary.md ]; then
            cat pr_summary.md >> $GITHUB_STEP_SUMMARY
          fi
